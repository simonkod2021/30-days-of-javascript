<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    <h1>Number guessing game!</h1>
    <label>Guess a number!</label>
    <input type="number" placeholder="Guess a number..." id="guessInput">
    <button onclick="guessNumber();">Guess</button>
    <div id="result" class="result">
    </div>
    <section class="instructions">
        <h2>Instructions</h2>
        <p>Guess a number between 1 and 100. If your guess is too high, you'll get a hint to guess lower. If your guess is too low, you'll get a hint to guess higher. Keep guessing until you find the correct number!</p> 
    </section>
    </div>
    <script src="guess.js"></script>
</body>
</html>
